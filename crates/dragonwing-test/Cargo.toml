[package]
name = "dragonwing-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Cross-backend parity testing for dragonwing-edge compute backends."

[lints]
workspace = true

[dependencies]
dragonwing-core = { path = "../dragonwing-core" }
dragonwing-cpu = { path = "../dragonwing-cpu" }
dragonwing-vulkan = { path = "../dragonwing-vulkan" }
dragonwing-onnx = { path = "../dragonwing-onnx", features = ["cpu", "vulkan"] }
dragonwing-shaders = { path = "../dragonwing-shaders" }

[[bin]]
name = "parity-test"
path = "src/bin/parity_test.rs"

# Task 007 — on-device benchmark for VulkanGraphRuntime.
[[bin]]
name = "device-benchmark"
path = "src/bin/device_benchmark.rs"

# Task 008 Phase 6 — YOLOv8 ONNX inspector (host-side).
[[bin]]
name = "yolo-inspect"
path = "src/bin/yolo_inspect.rs"

# Task 008 Phase 6 — YOLOv8 end-to-end benchmark on Vulkan.
[[bin]]
name = "yolo-benchmark"
path = "src/bin/yolo_benchmark.rs"
