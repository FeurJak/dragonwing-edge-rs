[package]
name = "dragonwing-onnx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Minimal ONNX model loader for dragonwing-edge inference framework."

[lints]
workspace = true

[features]
default = []
cpu = ["dep:dragonwing-cpu"]
# `vulkan` enables the Vulkan runtime, which falls back to CPU for ops
# that don't have Vulkan shaders yet (Split, Concat, Slice, Sub, Div,
# Resize, Transpose). So it pulls in `cpu` transitively.
vulkan = ["dep:dragonwing-vulkan", "dep:dragonwing-cpu"]

[dependencies]
dragonwing-core = { path = "../dragonwing-core" }
dragonwing-cpu = { path = "../dragonwing-cpu", optional = true }
dragonwing-vulkan = { path = "../dragonwing-vulkan", optional = true }
